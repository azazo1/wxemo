# aarch64 上启用 aes crate 的 ARMv8 密码学扩展后端.
#
# `aes` 0.8 对两个平台的处理并不对称:
#
# - x86_64 默认走 autodetect, 运行期检测 AES-NI, 有就用.
# - aarch64 只有设置了 `aes_armv8` 才会编入 armv8 后端, 否则静默回落到纯软件的
#   fixslicing 实现, 于是同一份代码在 Apple Silicon 上反而比 x86_64 慢好几倍.
#
# 这里只影响 `cfg(aes_armv8)` 的取值, 不改变任何 crate 的行为.
#
# 为什么限定 macOS 与 Linux: 该 crate 只在这两个平台上对 armv8 后端做运行期检测,
# 文档原话是 "在其他平台上必须通过 RUSTFLAGS 启用 aes target feature".
# Windows aarch64 的 rustc 默认不启用该 target feature, 只加这个 cfg 会直接编译失败
# (CI 的 windows-aarch64 就是因此挂掉的), 而强行加 `-C target-feature=+aes` 又会让
# 缺少该扩展的 CPU 在运行期 SIGILL —— 因为这条路径没有运行期检测兜底.
# 所以 Windows aarch64 保持软件实现: 慢一些, 但不会崩.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "macos", target_os = "linux")))']
rustflags = ["--cfg", "aes_armv8"]

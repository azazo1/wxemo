[package]
name = "wxemo"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "微信 4.x 自定义表情包的 seed 搜索与解密工具"
license = "MIT"

[[bin]]
name = "wxemo"
path = "src/main.rs"

[features]
# CUDA 后端. 打开后构建脚本会用 nvcc 把 kernel.cu 编成 cubin 并嵌进二进制.
# 不打开时整个后端不参与编译, 默认构建在 macOS 上完全不受影响.
cuda = []

[dependencies]
aes = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
indicatif = "0.17"
libloading = "0.8"
md-5 = "0.10"
pollster = "1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tracing = "0.1"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

# macOS 上的原生 Metal compute 后端. MSL 在运行期由驱动编译, 不需要构建期的 metal 编译器.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[package]
name = "seedsearch"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
md-5 = "0.10"
rayon = "1.10"
tracing = "0.1"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
